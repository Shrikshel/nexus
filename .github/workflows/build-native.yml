name: Build GraalVM Native Binaries & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-native:
    name: Build Native (${{ matrix.os }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            binary_name: nexus
            asset_name: nexus-linux-amd64
          - os: windows
            arch: amd64
            runner: windows-latest
            binary_name: nexus.exe
            asset_name: nexus-windows-amd64.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up GraalVM JDK 17
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '17'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      - name: Build Native Executable (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x mvnw
          ./mvnw -B -Pnative package -DskipTests
          cp target/${{ matrix.binary_name }} ${{ matrix.asset_name }}
          chmod +x ${{ matrix.asset_name }}
          if [ "${{ matrix.os }}" = "linux" ]; then
            chmod +x scripts/package-deb.sh
            ./scripts/package-deb.sh
            cp target/nexus-linux-amd64.deb nexus-linux-amd64.deb
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum nexus-linux-amd64.deb > nexus-linux-amd64.deb.sha256
            fi
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
          fi

      - name: Build Native Executable (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\mvnw.cmd -B -Pnative package -DskipTests
          Copy-Item target\${{ matrix.binary_name }} -Destination ${{ matrix.asset_name }}
          $hash = (Get-FileHash ${{ matrix.asset_name }} -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.asset_name }}" | Out-File -Encoding ascii "${{ matrix.asset_name }}.sha256"

      - name: Verify Binary Output
        if: runner.os != 'Windows'
        run: |
          ./${{ matrix.asset_name }} --help
          ./${{ matrix.asset_name }} system info

      - name: Verify Binary Output (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\${{ matrix.asset_name }} --help
          .\${{ matrix.asset_name }} system info

      - name: Upload Native Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
            nexus-linux-*.deb
            nexus-linux-*.deb.sha256
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build-native
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release == true || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets & Checksums
        run: |
          mkdir -p release-assets
          find artifacts -type f -name "nexus-*" -not -name "*.sha256" -exec cp {} release-assets/ \;
          find artifacts -type f -name "*.sha256" -exec cat {} + > release-assets/SHA256SUMS.txt
          echo "Release assets prepared:"
          ls -la release-assets/
          cat release-assets/SHA256SUMS.txt

      - name: Resolve Release Version & Metadata
        run: |
          POM_VERSION="$(awk '/<\/parent>/ {found=1} found && /<version>/ {gsub(/.*<version>|<\/version>.*/, ""); print; exit}' pom.xml 2>/dev/null || true)"
          echo "POM_VERSION=$POM_VERSION" >> $GITHUB_ENV

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            if [[ "$TAG_NAME" == *SNAPSHOT* ]] || [[ "$TAG_NAME" == *snapshot* ]]; then
              IS_PRERELEASE="true"
              RELEASE_NAME="Nexus Snapshot $TAG_NAME"
            else
              IS_PRERELEASE="false"
              RELEASE_NAME="Nexus Release $TAG_NAME"
            fi
          else
            TAG_NAME="v${POM_VERSION}"
            if [[ "$POM_VERSION" == *SNAPSHOT* ]]; then
              IS_PRERELEASE="true"
              RELEASE_NAME="Nexus Snapshot v${POM_VERSION}"
            else
              IS_PRERELEASE="false"
              RELEASE_NAME="Nexus Release v${POM_VERSION}"
            fi
          fi

          echo "RELEASE_TAG=$TAG_NAME" >> $GITHUB_ENV
          echo "RELEASE_NAME=$RELEASE_NAME" >> $GITHUB_ENV
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> $GITHUB_ENV
          echo "Resolved release metadata: tag=$TAG_NAME, name=$RELEASE_NAME, prerelease=$IS_PRERELEASE"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump Snapshot Version for Next Commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          POM_VERSION="${{ env.POM_VERSION }}"
          if [[ "$POM_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)-SNAPSHOT$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            NEXT_PATCH=$((PATCH + 1))
            NEXT_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}-SNAPSHOT"
            echo "Auto-bumping snapshot version: $POM_VERSION -> $NEXT_VERSION"

            # Update pom.xml project version
            python3 -c "
            import re
            with open('pom.xml', 'r') as f:
                content = f.read()
            pattern = r'(</parent>[\s\S]*?<artifactId>nexus</artifactId>\s*<version>)(.*?)(</version>)'
            new_content = re.sub(pattern, rf'\g<1>$NEXT_VERSION\g<3>', content, count=1)
            with open('pom.xml', 'w') as f:
                f.write(new_content)
            "

            # Update NexusUpdateService.java
            sed -i "s/public static final String CURRENT_VERSION = \".*\";/public static final String CURRENT_VERSION = \"$NEXT_VERSION\";/" src/main/java/com/nexus/platform/NexusUpdateService.java

            # Update NexusCliRootCommand.java
            sed -i "s/version = \"Nexus .*\",/version = \"Nexus $NEXT_VERSION\",/" src/main/java/com/nexus/adapters/cli/NexusCliRootCommand.java

            # Configure Git credentials
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            # Commit and push
            git add pom.xml src/main/java/com/nexus/platform/NexusUpdateService.java src/main/java/com/nexus/adapters/cli/NexusCliRootCommand.java
            git commit -m "chore(release): bump snapshot version to $NEXT_VERSION [skip ci]"
            git push origin main
          else
            echo "Version '$POM_VERSION' is a formal release (non-SNAPSHOT). Skipping auto-bump."
          fi
