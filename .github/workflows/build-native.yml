name: Build GraalVM Native Binaries

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-native:
    name: Build Native (${{ matrix.os }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            binary_name: nexus
            asset_name: nexus-linux-amd64
          - os: windows
            arch: amd64
            runner: windows-latest
            binary_name: nexus.exe
            asset_name: nexus-windows-amd64.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up GraalVM JDK 17
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '17'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      - name: Build Native Executable (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x mvnw
          ./mvnw -B -Pnative package -DskipTests
          cp target/${{ matrix.binary_name }} ${{ matrix.asset_name }}
          chmod +x ${{ matrix.asset_name }}
          if [ "${{ matrix.os }}" = "linux" ]; then
            chmod +x scripts/package-deb.sh
            ./scripts/package-deb.sh
            cp target/nexus-linux-amd64.deb nexus-linux-amd64.deb
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum nexus-linux-amd64.deb > nexus-linux-amd64.deb.sha256
            fi
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
          fi

      - name: Build Native Executable (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\mvnw.cmd -B -Pnative package -DskipTests
          Copy-Item target\${{ matrix.binary_name }} -Destination ${{ matrix.asset_name }}
          $hash = (Get-FileHash ${{ matrix.asset_name }} -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.asset_name }}" | Out-File -Encoding ascii "${{ matrix.asset_name }}.sha256"

      - name: Verify Binary Output
        if: runner.os != 'Windows'
        run: |
          ./${{ matrix.asset_name }} --help
          ./${{ matrix.asset_name }} info

      - name: Verify Binary Output (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\${{ matrix.asset_name }} --help
          .\${{ matrix.asset_name }} info

      - name: Upload Native Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
            nexus-linux-*.deb
            nexus-linux-*.deb.sha256
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build-native
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release == true || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets & Checksums
        run: |
          mkdir -p release-assets
          find artifacts -type f -name "nexus-*" -not -name "*.sha256" -exec cp {} release-assets/ \;
          find artifacts -type f -name "*.sha256" -exec cat {} + > release-assets/SHA256SUMS.txt
          echo "Release assets prepared:"
          ls -la release-assets/
          cat release-assets/SHA256SUMS.txt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Latest Release (master)' }}
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
